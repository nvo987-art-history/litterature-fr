<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>500 — Internal Server Error</title>

    <style>
        :root {
            --bg: #090a0f;
            --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.09);
            --text: #f8f8fa;
            --muted: #9ca3af;
            --accent: #ff5f6d;
            --accent-soft: #ff9b7a;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text);
            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 95, 109, 0.16), transparent 28rem),
                radial-gradient(circle at 85% 85%, rgba(255, 155, 122, 0.1), transparent 28rem),
                var(--bg);
        }

        .page {
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            overflow: hidden;
        }

        .card {
            position: relative;
            width: min(100%, 690px);
            padding: clamp(32px, 7vw, 64px);
            overflow: hidden;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            box-shadow:
                0 30px 100px var(--shadow),
                inset 0 1px rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            animation: enter 0.75s cubic-bezier(.2, .85, .25, 1) both;
        }

        .card::before {
            position: absolute;
            top: -100px;
            left: 50%;
            width: 260px;
            height: 260px;
            content: "";
            background: rgba(255, 95, 109, 0.08);
            border-radius: 50%;
            filter: blur(50px);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .icon-wrap {
            position: relative;
            display: grid;
            place-items: center;
            width: 80px;
            height: 80px;
            margin: 0 auto 28px;
            color: var(--accent-soft);
            background: rgba(255, 95, 109, 0.1);
            border: 1px solid rgba(255, 155, 122, 0.18);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
        }

        .icon-wrap svg {
            width: 40px;
            height: 40px;
        }

        .error-code {
            position: relative;
            margin-bottom: 14px;
            font-size: clamp(4.5rem, 15vw, 8.5rem);
            font-weight: 850;
            line-height: 0.9;
            letter-spacing: -0.08em;
            background: linear-gradient(135deg, #fff 15%, var(--accent-soft));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            position: relative;
            margin-bottom: 16px;
            font-size: clamp(1.7rem, 5vw, 2.5rem);
            letter-spacing: -0.04em;
        }

        .description {
            position: relative;
            max-width: 550px;
            margin: 0 auto;
            color: var(--muted);
            line-height: 1.7;
            font-size: 1.05rem;
        }

        .status-line {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 28px 0 30px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(255, 95, 109, 0.6);
            animation: ping 2s infinite;
        }

        .countdown-box {
            position: relative;
            margin-bottom: 22px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .countdown {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            margin: 0 4px;
            color: #fff;
            font-weight: 700;
            background: rgba(255, 95, 109, 0.14);
            border: 1px solid rgba(255, 155, 122, 0.18);
            border-radius: 9px;
        }

        .button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 25px;
            color: #fff;
            font-weight: 650;
            text-decoration: none;
            background: linear-gradient(135deg, var(--accent), #d83c59);
            border-radius: 14px;
            box-shadow: 0 15px 38px rgba(255, 95, 109, 0.22);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 48px rgba(255, 95, 109, 0.34);
        }

        .button:active {
            transform: translateY(0);
        }

        .button svg {
            width: 18px;
            height: 18px;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: scale(0.97) translateY(18px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 95, 109, 0.16);
            }
            50% {
                box-shadow: 0 0 0 14px rgba(255, 95, 109, 0);
            }
        }

        @keyframes ping {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 95, 109, 0.5);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(255, 95, 109, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 95, 109, 0);
            }
        }

        @media (max-width: 520px) {
            .page {
                padding: 16px;
            }

            .card {
                border-radius: 24px;
            }

            .icon-wrap {
                width: 70px;
                height: 70px;
            }

            .description {
                font-size: 0.98rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card" aria-labelledby="error-title">
            <div class="icon-wrap" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 9v4"></path>
                    <path d="M12 17h.01"></path>
                    <path d="M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>
                </svg>
            </div>

            <div class="error-code">500</div>

            <h1 id="error-title">Something went wrong</h1>

            <p class="description">
                Our server encountered an unexpected condition and could not
                complete your request. The issue may be temporary.
            </p>

            <div class="status-line">
                <span class="status-dot" aria-hidden="true"></span>
                We're working to restore normal service.
            </div>

            <p class="countdown-box">
                Redirecting you to the homepage in
                <span class="countdown" id="countdown">8</span>
                seconds.
            </p>

            <a href="/" class="button">
                Back to homepage
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                </svg>
            </a>
        </section>
    </main>

    <script>
        (() => {
            const homepage = "/";
            const countdownElement = document.getElementById("countdown");
            let remaining = 8;

            const timer = setInterval(() => {
                remaining -= 1;
                countdownElement.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(timer);
                    window.location.href = homepage;
                }
            }, 1000);
        })();
    </script>
</body>
</html>
