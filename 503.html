<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>503 — Service Unavailable</title>

    <style>
        :root {
            --bg: #07100f;
            --surface: rgba(255, 255, 255, 0.055);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f5fbfa;
            --muted: #9aa9a6;
            --accent: #2dd4a8;
            --accent-light: #82f6d3;
            --shadow: rgba(0, 0, 0, 0.48);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text);
            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 20% 80%, rgba(45, 212, 168, 0.14), transparent 30rem),
                radial-gradient(circle at 82% 15%, rgba(45, 170, 212, 0.1), transparent 26rem),
                var(--bg);
        }

        .page {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            overflow: hidden;
        }

        .grid {
            position: absolute;
            inset: 0;
            opacity: 0.16;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(circle at center, black, transparent 75%);
            pointer-events: none;
        }

        .card {
            position: relative;
            width: min(100%, 700px);
            padding: clamp(32px, 7vw, 64px);
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            box-shadow:
                0 30px 100px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            animation: appear 0.8s cubic-bezier(.2, .8, .2, 1) both;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 26px;
            padding: 8px 13px;
            color: var(--accent-light);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: rgba(45, 212, 168, 0.08);
            border: 1px solid rgba(130, 246, 211, 0.14);
            border-radius: 999px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            animation: blink 1.8s ease-in-out infinite;
        }

        .icon-wrap {
            display: grid;
            place-items: center;
            width: 82px;
            height: 82px;
            margin: 0 auto 26px;
            color: var(--accent-light);
            background: rgba(45, 212, 168, 0.1);
            border: 1px solid rgba(130, 246, 211, 0.16);
            border-radius: 25px;
            transform: rotate(-4deg);
            animation: tool-float 4.5s ease-in-out infinite;
        }

        .icon-wrap svg {
            width: 42px;
            height: 42px;
        }

        .error-code {
            margin-bottom: 14px;
            font-size: clamp(4.5rem, 15vw, 8.5rem);
            font-weight: 850;
            line-height: 0.9;
            letter-spacing: -0.08em;
            background: linear-gradient(135deg, #fff 20%, var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            margin-bottom: 16px;
            font-size: clamp(1.7rem, 5vw, 2.5rem);
            letter-spacing: -0.04em;
        }

        .description {
            max-width: 560px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .progress-track {
            width: min(100%, 360px);
            height: 5px;
            margin: 30px auto 26px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 999px;
        }

        .progress-bar {
            width: 38%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: inherit;
            animation: progress 2.4s ease-in-out infinite alternate;
        }

        .redirect-info {
            margin-bottom: 22px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .countdown {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 32px;
            height: 32px;
            margin: 0 4px;
            color: var(--text);
            font-weight: 750;
            background: rgba(45, 212, 168, 0.1);
            border: 1px solid rgba(130, 246, 211, 0.15);
            border-radius: 9px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 25px;
            color: #05221c;
            font-weight: 750;
            text-decoration: none;
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(45, 212, 168, 0.18);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
            box-shadow: 0 22px 48px rgba(45, 212, 168, 0.28);
        }

        .button:active {
            transform: translateY(0);
        }

        .button svg {
            width: 18px;
            height: 18px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(22px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes tool-float {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }
            50% {
                transform: translateY(-8px) rotate(2deg);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 0.45;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes progress {
            from {
                width: 28%;
                transform: translateX(-10%);
            }
            to {
                width: 72%;
                transform: translateX(35%);
            }
        }

        @media (max-width: 520px) {
            .page {
                padding: 16px;
            }

            .card {
                border-radius: 24px;
            }

            .icon-wrap {
                width: 70px;
                height: 70px;
                border-radius: 22px;
            }

            .description {
                font-size: 0.98rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="grid" aria-hidden="true"></div>

        <section class="card" aria-labelledby="error-title">
            <div class="badge">
                <span class="badge-dot" aria-hidden="true"></span>
                Temporary interruption
            </div>

            <div class="icon-wrap" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a5.5 5.5 0 0 0-7 7L3 18v3h3l4.7-4.7a5.5 5.5 0 0 0 7-7l-3.4 3.4-2.7-2.7 3.1-3.7Z"></path>
                </svg>
            </div>

            <div class="error-code">503</div>

            <h1 id="error-title">Service temporarily unavailable</h1>

            <p class="description">
                We're currently performing maintenance or experiencing a
                temporary interruption. Please check back again shortly.
            </p>

            <div class="progress-track" aria-hidden="true">
                <div class="progress-bar"></div>
            </div>

            <p class="redirect-info">
                Returning you to the homepage in
                <span class="countdown" id="countdown">8</span>
                seconds.
            </p>

            <a href="/" class="button">
                Back to homepage
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                </svg>
            </a>
        </section>
    </main>

    <script>
        (() => {
            const homepage = "/";
            const countdownElement = document.getElementById("countdown");
            let remaining = 8;

            const timer = setInterval(() => {
                remaining -= 1;
                countdownElement.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(timer);
                    window.location.href = homepage;
                }
            }, 1000);
        })();
    </script>
</body>
</html>
